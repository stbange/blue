<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><link rel="icon" href="data:," /><title>Blue · Hybrid synthesizer</title
  ><link rel="stylesheet" href="style.css" />
  <header>
    <strong>Blue<span> / </span></strong><span>Hybrid synthesizer</span
    ><button id="start">Start audio</button>
  </header>
  <main>
    <aside>
      <h2>Patch library</h2>
      <select id="pack" aria-label="Content pack"></select>
      <nav id="library"></nav>
      <button id="midi">Connect MIDI</button
      ><button id="xr">Enter WebXR</button>
    </aside>
    <section>
      <h1 id="name">Glass Tide</h1>
      <canvas
        id="scope"
        width="900"
        height="120"
        aria-label="Output oscilloscope"
      ></canvas>
      <div id="lanes"></div>
      <div class="panel">
        <h2>Performance</h2>
        <div id="macros"></div>
      </div>
      <div class="tuning-bar">
        <label>Keyboard tuning
          <select id="tuning"></select>
        </label>
        <span id="tuning-range"></span>
      </div>
      <div id="keyboard" aria-label="Keyboard"></div>
      <details id="tuning-builder">
        <summary>Tuning builder</summary>
        <div class="tuning-fields">
          <label>Root MIDI note <input id="tuning-root" type="number" min="0" max="127" step="1" /></label>
          <label>Scale steps in cents <input id="tuning-cents" type="text" spellcheck="false" /></label>
          <button id="tuning-apply" type="button">Save custom tuning</button>
        </div>
        <p id="tuning-help">C2 is MIDI 36. Enter 4–24 ascending steps starting at 0. Blue repeats them every 1200 cents.</p>
        <p id="tuning-error" role="alert" hidden></p>
      </details>
      <p id="status" role="status">Loading factory pack…</p>
      <div class="tools">
        <button id="record">Record output</button
        ><button id="save">Save revision</button
        ><button id="reload">Reload files</button>
      </div>
      <details>
        <summary>Sound editor</summary>
        <div id="sound-editor"></div>
      </details>
      <details>
        <summary>Patch and Lua editor</summary>
        <label
          >Patch JSON<textarea
            id="document"
            spellcheck="false"
          ></textarea></label
        ><label
          >Lua mapping<textarea
            id="mapping"
            spellcheck="false"
          ></textarea></label
        ><button id="apply">Apply edits</button
        ><button id="export">Export pack</button
        ><label
          >Import pack <input type="file" id="import" accept=".zip"
        /></label>
      </details>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</html>
