name: Build and exercise Blue
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxxf86vm-dev xvfb xauth
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure
      - run: cmake --install build --component Blue --prefix package
      - run: pip install pyautogui==0.9.54
      - if: runner.os == 'Linux'
        run: xvfb-run -a python tests/e2e_desktop.py package/Blue
      - if: runner.os == 'Windows'
        run: python tests/e2e_desktop.py package/Blue.exe
      - if: runner.os == 'macOS'
        run: python tests/e2e_desktop.py package/Blue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Blue-${{ runner.os }}
          path: package/
  web:
    env:
      BLUE_HEADED: "1"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.20
      - run: emcmake cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-web --parallel 4
      - uses: actions/upload-artifact@v4
        with:
          name: Blue-Web
          path: build-web/bin/
  browser-e2e:
    needs: web
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        surface: [chromium, firefox, webkit, webxr]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Blue-Web
          path: site
      - run: pip install playwright==1.62.0 --break-system-packages
      - if: matrix.surface == 'firefox'
        run: chown "$(id -u):$(id -g)" /github/home
      - if: matrix.surface != 'webxr'
        run: python tests/e2e_web.py site --browser ${{ matrix.surface }}
      - uses: actions/setup-node@v4
        if: matrix.surface == 'webxr'
        with:
          node-version: 24
      - if: matrix.surface == 'webxr'
        run: |
          npm install --no-save iwer@2.8.0
          python tests/e2e_web.py site --iwer node_modules/iwer/build/iwer.min.js
  unit-coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cmake -S . -B coverage -G Ninja -DBLUE_COVERAGE=ON
      - run: cmake --build coverage --parallel 4
      - run: python tests/coverage.py coverage
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix tests/js && node tests/js/node_modules/c8/bin/c8.js --all --src hosts/web/site --include "hosts/web/site/*.js" --check-coverage --lines 95 --reporter=text node --experimental-vm-modules --test tests/js/units.mjs
      - run: pip install numpy && python tests/sonic.py coverage/bin/blue-render
      - run: npm ci --prefix tools/openspec && tools/openspec/node_modules/.bin/openspec validate --all --strict --no-interactive
